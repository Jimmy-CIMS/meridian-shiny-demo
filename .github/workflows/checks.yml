name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript setup.R
      - name: Test data and reactive behavior
        run: Rscript tests/test-app.R
      - name: Validate JavaScript
        run: node --check www/app.js
      - name: Test chart rendering and interactions
        run: node tests/test-charts.cjs
